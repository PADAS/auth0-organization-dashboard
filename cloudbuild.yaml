steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/auth0-b2b-saas:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/auth0-b2b-saas:latest', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/auth0-b2b-saas:$COMMIT_SHA']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/auth0-b2b-saas:latest']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'auth0-b2b-saas'
      - '--image'
      - 'gcr.io/$PROJECT_ID/auth0-b2b-saas:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'NEXT_PUBLIC_AUTH0_DOMAIN=${_AUTH0_DOMAIN},AUTH0_MANAGEMENT_API_DOMAIN=${_AUTH0_DOMAIN},NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1'
      - '--set-secrets'
      - 'AUTH0_CLIENT_ID=auth0-client-id:latest,AUTH0_CLIENT_SECRET=auth0-client-secret:latest,AUTH0_MANAGEMENT_CLIENT_ID=auth0-management-client-id:latest,AUTH0_MANAGEMENT_CLIENT_SECRET=auth0-management-client-secret:latest,SESSION_ENCRYPTION_SECRET=session-encryption-secret:latest,APP_BASE_URL=app-base-url:latest'
      - '--set-env-vars'
      - 'AUTH0_ADMIN_ROLE_ID=${_AUTH0_ADMIN_ROLE_ID},AUTH0_MEMBER_ROLE_ID=${_AUTH0_MEMBER_ROLE_ID},DEFAULT_CONNECTION_ID=${_DEFAULT_CONNECTION_ID},CUSTOM_CLAIMS_NAMESPACE=${_CUSTOM_CLAIMS_NAMESPACE}'

images:
  - 'gcr.io/$PROJECT_ID/auth0-b2b-saas:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/auth0-b2b-saas:latest'

options:
  logging: CLOUD_LOGGING_ONLY
